name: Build Topflow Dedicated App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 自动生成并赋予 Gradle 执行权限
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: 编译 Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: 上传打包好的 APK 产物
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Topflow-Toolkit-App
        path: "app/build/outputs/apk/debug/*.apk"
