name: Build Topflow Dedicated App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 JDK 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 自动补全可能缺失的项目结构与核心文件
      run: |
        mkdir -p app/src/main/java/com/topflow/toolkit
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 补全 activity_main.xml
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent">
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        </RelativeLayout>
        EOF

        # 补全 AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:usesCleartextTraffic="true"
                android:label="Topflow 工具箱"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 补全 AdbManager.java
        cat << 'EOF' > app/src/main/java/com/topflow/toolkit/AdbManager.java
        package com.topflow.toolkit;

        import java.io.InputStream;
        import java.io.OutputStream;
        import java.net.InetSocketAddress;
        import java.net.Socket;
        import java.nio.charset.StandardCharsets;

        public class AdbManager {
            private static final String DEFAULT_HOST = "192.168.0.1";
            private static final int DEFAULT_PORT = 5555;
            private static final int TIMEOUT_MS = 4000;

            public interface AdbCallback {
                void onSuccess(String output);
                void onError(String error);
            }

            public static void execCmd(String command, AdbCallback callback) {
                new Thread(() -> {
                    Socket socket = null;
                    try {
                        socket = new Socket();
                        socket.connect(new InetSocketAddress(DEFAULT_HOST, DEFAULT_PORT), TIMEOUT_MS);
                        socket.setSoTimeout(TIMEOUT_MS);

                        OutputStream out = socket.getOutputStream();
                        InputStream in = socket.getInputStream();

                        String packet = "shell:" + command + "\n";
                        out.write(packet.getBytes(StandardCharsets.UTF_8));
                        out.flush();

                        byte[] buffer = new byte[2048];
                        int bytesRead = in.read(buffer);

                        if (bytesRead > 0) {
                            callback.onSuccess(new String(buffer, 0, bytesRead, StandardCharsets.UTF_8));
                        } else {
                            callback.onSuccess("指令下发成功");
                        }
                    } catch (Exception e) {
                        callback.onError("ADB 连接超时");
                    } finally {
                        try {
                            if (socket != null && !socket.isClosed()) socket.close();
                        } catch (Exception ignored) {}
                    }
                }).start();
            }
        }
        EOF

    - name: 初始化 Gradle 8.2 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: 编译 Debug APK
      run: gradle assembleDebug

    - name: 上传打包好的 APK 产物
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Topflow-Toolkit-App
        path: "**/build/outputs/apk/debug/*.apk"
