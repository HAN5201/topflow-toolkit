name: Build Topflow Dedicated App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Java 17 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 配置 Android SDK
      uses: android-actions/setup-android@v3

    - name: 自动化配置与构建
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: 编译 Debug APK
      run: gradle assembleDebug --no-daemon --info

    - name: 上传 APK 产物
      uses: actions/upload-artifact@v4
      with:
        name: Topflow-Toolkit-App
        path: app/build/outputs/apk/debug/app-debug.apk
