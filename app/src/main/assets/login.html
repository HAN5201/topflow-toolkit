<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topflow 5G 控制台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #F4F5F7; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .login-card { background: #FFF; width: 88%; max-width: 360px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        .icon-container { width: 64px; height: 64px; background: #1A73E8; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .icon-container svg { width: 36px; height: 36px; fill: #FFF; }
        .title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #757575; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-label { font-size: 12px; color: #666; margin-bottom: 6px; display: block; }
        .input-field { width: 100%; height: 44px; padding: 0 14px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 14px; background: #FAFAFA; outline: none; }
        .btn-submit { width: 100%; height: 44px; background: #1A73E8; color: #FFF; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
        .footer-info { margin-top: 20px; font-size: 11px; color: #9E9E9E; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="icon-container">
        <svg viewBox="0 0 24 24"><path d="M12,3C7.95,3 4.21,4.64 1.44,7.31L3,8.87C5.37,6.58 8.53,5.16 12,5.16C15.47,5.16 18.63,6.58 21,8.87L22.56,7.31C19.79,4.64 16.05,3 12,3M12,8C9.31,8 6.84,9.07 5,10.82L6.56,12.38C7.97,10.98 9.88,10.12 12,10.12C14.12,10.12 16.03,10.98 17.44,12.38L19,10.82C17.16,9.07 14.69,8 12,8M12,13C10.67,13 9.45,13.53 8.56,14.41L10.12,15.97C10.6,15.49 11.26,15.2 12,15.2C12.74,15.2 13.4,15.49 13.88,15.97L15.44,14.41C14.55,13.53 13.33,13 12,13M12,18A2,2 0 0,0 10,20A2,2 0 0,0 12,22A2,2 0 0,0 14,20A2,2 0 0,0 12,18Z"/></svg>
    </div>
    <div class="title">Topflow Toolkit</div>
    <div class="subtitle">5G 随身 WiFi 管理后台</div>
    <form>
        <div class="input-group">
            <label class="input-label">管理密码</label>
            <input type="password" id="pwd" class="input-field" placeholder="默认: admin" value="admin">
        </div>
        <button type="button" class="btn-submit" onclick="connectDevice()">一键连接并锁 B16</button>
    </form>
    <div class="footer-info">已连接本地资源界面</div>
</div>

<script>
    function connectDevice() {
        var pwd = document.getElementById('pwd').value;
        // 调用 Android 原生接口连接网关
        if (window.AndroidBridge) {
            window.AndroidBridge.connectDevice(pwd);
        } else {
            window.location.href = "http://192.168.0.1";
        }
    }
</script>
</body>
</html>
