<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TopFlow Network Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #030813;
            background-image: 
                radial-gradient(circle at 50% 30%, #0052d4 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, #001f52 0%, #030813 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            overflow: hidden;
        }

        /* 顶部 Logo 区块 */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .tf-logo {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(180deg, #ffffff 0%, #00d2ff 50%, #0066ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            letter-spacing: -1px;
            line-height: 1;
        }
        .brand-name {
            font-size: 28px;
            font-weight: 800;
            font-style: italic;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 4px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }
        .slogan {
            font-size: 10px;
            color: #00d2ff;
            letter-spacing: 4px;
            margin-top: 6px;
            opacity: 0.8;
            font-weight: 600;
        }

        /* 登录卡片 (赛博高透框) */
        .login-card {
            width: 100%;
            max-width: 360px;
            background: rgba(6, 18, 41, 0.75);
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 0 30px rgba(0, 110, 255, 0.25), inset 0 0 15px rgba(0, 210, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .card-title {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #e0f7ff;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        /* 输入框样式 */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-group icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #00d2ff;
            opacity: 0.8;
        }
        .input-field {
            width: 100%;
            height: 46px;
            background: rgba(3, 15, 38, 0.6);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 10px;
            padding: 0 16px 0 42px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
            background: rgba(3, 15, 38, 0.85);
        }
        .input-field::placeholder {
            color: #4a6a94;
        }

        /* 复选框与忘记密码 */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 20px;
            color: #8ab4f8;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .remember-me input {
            accent-color: #00d2ff;
        }

        /* 登录按钮 */
        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, #0052d4 0%, #00a6ff 50%, #0052d4 100%);
            background-size: 200% auto;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 166, 255, 0.5);
            transition: all 0.3s ease;
        }
        .btn-submit:active {
            transform: scale(0.98);
            box-shadow: 0 0 10px rgba(0, 166, 255, 0.3);
        }

        /* 快捷登录区 */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #3b5a82;
            font-size: 11px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(0, 150, 255, 0.15);
        }
        .divider span {
            padding: 0 10px;
        }

        .quick-login {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .quick-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #8ab4f8;
            font-size: 11px;
            cursor: pointer;
        }
        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(3, 15, 38, 0.6);
            border: 1px solid rgba(0, 150, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .icon-circle svg {
            width: 20px;
            height: 20px;
            fill: #00d2ff;
        }
        .quick-btn:active .icon-circle {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- 顶部极光 Header -->
    <div class="header">
        <div class="tf-logo">TF</div>
        <div class="brand-name">TopFlow</div>
        <div class="slogan">NETWORK · CONTROL · FUTURE</div>
    </div>

    <!-- 中间高透卡片 -->
    <div class="login-card">
        <div class="card-title">— 用户登录 —</div>

        <form onsubmit="return false;">
            <div class="input-group">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" class="input-field" placeholder="用户名 / 默认: admin" value="admin">
            </div>

            <div class="input-group">
                <svg class="icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" id="pwd" class="input-field" placeholder="密码" value="admin">
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" checked> 记住密码
                </label>
                <span>锁 B16 频段</span>
            </div>

            <button type="button" class="btn-submit" onclick="submitLogin()">登 录</button>
        </form>

        <div class="divider">
            <span>或使用以下方式登录</span>
        </div>

        <div class="quick-login">
            <div class="quick-btn" onclick="submitLogin()">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                </div>
                <span>直连网关</span>
            </div>
            <div class="quick-btn" onclick="submitLogin()">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/></svg>
                </div>
                <span>设备登录</span>
            </div>
            <div class="quick-btn" onclick="submitLogin()">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg>
                </div>
                <span>扫码登录</span>
            </div>
        </div>
    </div>

    <script>
        function submitLogin() {
            var pwd = document.getElementById('pwd').value;
            if (window.AndroidBridge) {
                window.AndroidBridge.connectDevice(pwd);
            } else {
                window.location.href = "http://192.168.0.1";
            }
        }
    </script>
</body>
</html>
