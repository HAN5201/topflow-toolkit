<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TopFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030813;
            font-family: -apple-system, sans-serif;
        }

        /* 全屏背景图容器 */
        .bg-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('bg.png') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
        }

        /* 表单浮层，精准对齐背景图里的输入框位置 */
        .form-overlay {
            position: absolute;
            bottom: 6%;
            width: 85%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 隐藏原生边框的透明输入框，直接对准背景图 */
        .input-box {
            width: 100%;
            height: 44px;
            background: rgba(3, 15, 38, 0.4);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 8px;
            padding: 0 16px 0 42px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .input-box:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        /* 登录按钮 */
        .btn-login {
            width: 100%;
            height: 46px;
            background: linear-gradient(90deg, #0052d4, #00d2ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .btn-login:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="bg-container">
    <div class="form-overlay">
        <input type="text" class="input-box" placeholder="用户名 / admin" value="admin">
        <input type="password" id="pwd" class="input-box" placeholder="密码" value="admin">
        <button type="button" class="btn-login" onclick="doLogin()">登 录</button>
    </div>
</div>

<script>
    function doLogin() {
        var pwd = document.getElementById('pwd').value;
        if (window.AndroidBridge) {
            window.AndroidBridge.connectDevice(pwd);
        } else {
            window.location.href = "http://192.168.0.1";
        }
    }
</script>

</body>
</html>
