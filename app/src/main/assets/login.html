<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TopFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020712;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 全屏原图背景 */
        .bg-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('bg.png') no-repeat center top;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
        }

        /* 交互蒙版区域：精准锚定到原图框内 */
        .interactive-panel {
            position: absolute;
            top: 51.5%; /* 垂直对齐原图输入框起点 */
            width: 76%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
        }

        /* 账号输入框（完全隐形，透出原图 UI） */
        .input-user {
            width: 100%;
            height: 42px;
            background: transparent;
            border: none;
            outline: none;
            color: #00d2ff;
            font-size: 14px;
            padding-left: 42px;
            padding-right: 10px;
        }

        /* 密码输入框间距调整 */
        .input-pwd {
            width: 100%;
            height: 42px;
            margin-top: 13px;
            background: transparent;
            border: none;
            outline: none;
            color: #00d2ff;
            font-size: 14px;
            padding-left: 42px;
            padding-right: 40px;
        }

        /* 隐形登录触发区域（精准覆盖原图的“登录”蓝色按钮） */
        .btn-login-trigger {
            width: 100%;
            height: 44px;
            margin-top: 53px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-login-trigger:active {
            background: rgba(0, 210, 255, 0.2);
        }

        /* 底部三个快捷登录区域 */
        .bottom-trigger-group {
            display: flex;
            width: 100%;
            height: 60px;
            margin-top: 50px;
        }

        .bottom-btn {
            flex: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="bg-container">
    <div class="interactive-panel">
        <!-- 账号输入 -->
        <input type="text" class="input-user" value="admin" autocomplete="off">

        <!-- 密码输入 -->
        <input type="password" id="pwd" class="input-pwd" value="admin" autocomplete="off">

        <!-- 点击原图蓝按钮触发登录 -->
        <button type="button" class="btn-login-trigger" onclick="doLogin()"></button>

        <!-- 底部快捷方式点击区 -->
        <div class="bottom-trigger-group">
            <div class="bottom-btn" onclick="doLogin()"></div>
            <div class="bottom-btn" onclick="doLogin()"></div>
            <div class="bottom-btn" onclick="doLogin()"></div>
        </div>
    </div>
</div>

<script>
    function doLogin() {
        var pwd = document.getElementById('pwd').value;
        if (window.AndroidBridge) {
            window.AndroidBridge.connectDevice(pwd);
        } else {
            window.location.href = "http://192.168.0.1";
        }
    }
</script>

</body>
</html>
