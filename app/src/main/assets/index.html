<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topflow Toolkit</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: #f4f4f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        h2 { margin-top: 0; color: #111; font-size: 20px; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            background-color: #007aff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            border: none;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Topflow 工具箱已就绪</h2>
        <p>如果页面没有自动跳转，请确认手机已连接设备 WiFi 热点。</p>
        <button class="btn" onclick="location.href='http://192.168.0.1'">手动进入后台 (192.168.0.1)</button>
        <button class="btn" style="background-color: #34c759; margin-top: 10px;" onclick="location.href='http://192.168.100.1'">进入后台 (192.168.100.1)</button>
    </div>
</body>
</html>
